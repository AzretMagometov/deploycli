[project]
name = "deploycli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AzretMagometov", email = "azret.magometov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "packaging>=26.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
deploycli = "deploycli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "docker: требует настоящий docker с плагином compose в PATH",
]
